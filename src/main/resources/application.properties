spring.application.name=AuthyAutho

# Use environment variables for production, fallback to local for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/AuthyAutho_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Krishna1}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sai}

# Change 'create' to 'update' for production so you don't lose data on every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Logging Configuration ??????????????????????????????????????????????????????
# Log level for the application package
logging.level.com.example.AuthyAutho=INFO
# Console log pattern: timestamp  thread  level  logger  message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Optional: write logs to a rolling file
logging.file.name=logs/AuthyAutho.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
