spring.application.name=AuthyAutho

# Use environment variables for production, fallback to local for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/AuthyAutho_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Krishna1}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sai}

# Change 'create' to 'update' for production so you don't lose data on every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect